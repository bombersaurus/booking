spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}

  jpa:
    hibernate:
      # validate, never update. Hibernate checks your entities match the schema
      # Flyway created and refuses to start if they don't. If you ever set this
      # to 'update', Hibernate silently edits your database and your migrations
      # stop being the source of truth.
      ddl-auto: validate
    # Don't hold a database connection open for the whole HTTP request.
    # On by default, and it hides lazy-loading bugs until they hit production.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    # Uncomment while learning: shows you every query Hibernate actually runs,
    # which is usually more (and stranger) than you expect.
    # org.hibernate.SQL: DEBUG
    org.springframework.web: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
