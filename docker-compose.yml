services:
  db:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booking-data:

# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v     (deletes the volume, Flyway reruns from scratch)
